name: reminder_app
description: Minimal Tracker
publish_to: 'none'
version: 1.2.2+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shared_preferences: ^2.2.2
  speech_to_text: ^7.0.0
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  intl: 0.20.2
  flutter_localizations:
    sdk: flutter
  permission_handler: ^11.3.1
  home_widget: ^0.7.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"